name: Sync permitted VK listings

on:
  workflow_dispatch:
  schedule:
    # 03:30 Moscow time (00:30 UTC): exactly one public request to the
    # owner-approved VK community. Telegram is handled by its own workflow.
    - cron: "30 0 * * *"

jobs:
  check-vk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node scripts/sync-partner-vk-listings.mjs
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
