name: Sync permitted partner listings


on:
  workflow_dispatch:
  schedule:
    # Telegram sources: every three hours, as before.
    - cron: "0 */3 * * *"


jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Check listing availability safeguards
        run: node --test scripts/partner-availability.test.mjs scripts/catalog-identity.test.mjs
      - run: npm run sync:partners
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

