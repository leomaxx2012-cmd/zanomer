name: Publish OTA update

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "assets/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"

permissions:
  contents: read

jobs:
  publish-ota-update:
    name: Опубликовать обновление приложения
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Забрать исходный код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Опубликовать обновление в production
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN не задан: публикация OTA-обновления пропущена."
            exit 0
          fi
          npx eas-cli@latest update --channel production --message "${{ github.sha }}" --non-interactive
